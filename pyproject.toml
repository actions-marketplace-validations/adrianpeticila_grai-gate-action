[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grai-gate"
version = "0.1.3"
description = "Deterministic anti-slop linter for markdown written by coding agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Adrian Peticila", email = "adrian@grai.page" }]
keywords = ["markdown", "linter", "ai-slop", "writing", "cadence"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://grai.page?utm_source=pypi&utm_medium=gate&utm_campaign=gate_v0.1#developer"
Repository = "https://github.com/adrianpeticila/grai-gate-action"
Issues = "https://github.com/adrianpeticila/grai-gate-action/issues"

[project.scripts]
grai-gate = "grai_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
